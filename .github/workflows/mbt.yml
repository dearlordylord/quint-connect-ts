name: Model-Based Tests
on:
  push:
    branches: [master, effect-4]
  pull_request:
    branches: [master, effect-4]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

jobs:
  mbt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
        env:
          QUINT_BACKEND: typescript

  # Real-Windows validation of Quint command-shim resolution and subprocess
  # process-tree cleanup (issue #16). The bash-based `pnpm run ci` script is not
  # Windows-portable, so this job runs the dedicated win32-guarded suite directly.
  # @informalsystems/quint is a pinned devDependency, so `quint.cmd` is installed
  # locally and no npx/registry network fallback is exercised.
  windows-lifecycle:
    needs: mbt
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:windows
        env:
          QUINT_BACKEND: typescript

  packed-consumer-node:
    needs: mbt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:packed-consumer

  packed-consumer-bun:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: mbt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:packed-consumer
        env:
          PACKED_CONSUMER_RUNTIME: bun
